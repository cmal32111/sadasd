name: Build V8 d8
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
    - name: Setup depot_tools
      shell: powershell
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
        "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Fetch V8
      shell: powershell
      run: |
        $env:DEPOT_TOOLS_WIN_TOOLCHAIN = 0
        mkdir C:\src
        cd C:\src
        fetch.bat v8

    - name: Build d8
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $env:DEPOT_TOOLS_WIN_TOOLCHAIN = 0

        # Detect available Windows SDK
        $sdkDir = "C:\Program Files (x86)\Windows Kits\10\Include"
        $sdkVer = (Get-ChildItem $sdkDir |
          Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
          Sort-Object Name -Descending |
          Select-Object -First 1).Name
        Write-Host "Detected Windows SDK: $sdkVer"

        $outDir = "C:\src\v8\out\x64.release"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null

        # Write args.gn using single-quoted strings — avoids YAML heredoc quoting conflict
        $l1 = 'is_debug = false'
        $l2 = 'target_cpu = "x64"'
        $l3 = 'win_sdk_version = "' + $sdkVer + '"'
        "$l1`n$l2`n$l3" | Set-Content -Path "$outDir\args.gn" -Encoding ascii

        Write-Host "=== args.gn ==="
        Get-Content "$outDir\args.gn"

        cd C:\src\v8

        # gn gen reads args.gn from outDir
        gn.bat gen $outDir
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        # Build d8
        autoninja.bat -C $outDir d8

    - name: Upload d8
      uses: actions/upload-artifact@v4
      with:
        name: d8-win-x64
        path: C:\src\v8\out\x64.release\d8.exe
